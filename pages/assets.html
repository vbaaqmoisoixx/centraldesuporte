              <template id="carouselTplCss">
                #trabalheConosco { 
                  display: flex;

            <div class="imgAsst">

              <div class="copyBtns">

                <button class="copyBtn" data-target="popUpTplCss" data-type="css">Copiar CSS</button>
                <button class="copyBtn" data-target="popUpTplJs" data-type="js">Copiar JS</button>
              </div>

              <template id="popUpTplHtml">
                <div class="popup-overlay" id="popup">
                  <div class="popup">
                    <img src="..." alt="logo" class="logoAnim"/>
                    <h2 class="textoP">Novidades para</h2>
                    <p class="ano">2026</p>
                    <button id="closePopup">Fechar</button>
                  </div>
                </div>
              </template>
              <template id="popUpTplCss">
                /* Fundo escurecido */
                .popup-overlay {
                  position: fixed;
                  top: 0;
                  left: 0;
                  width: 100%;
                  height: 100%;
                  background: rgba(0, 0, 0, 0.6);
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  visibility: hidden;
                  opacity: 0;
                  transition: opacity 0.3s ease, visibility 0.3s;
                  z-index: 9999;
                }
                
                /* Caixa do pop-up */
                .popup {
                  background: #fff;
                  padding: 30px;
                  border-radius: 15px;
                  width: 350px;
                  text-align: center;
                  box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
                  position: relative;
                  animation: fadeIn 0.5s ease;
                }

                /* Botão de fechar */
                .popup button {
                  background: #181818;
                  border: none;
                  color: #fff;
                  padding: 10px 20px;
                  border-radius: 8px;
                  cursor: pointer;
                  transition: background 0.2s;
                  margin-top: 15px;
                }
                
                .popup button:hover {
                  color: #181818;
                  background: #b6e128;
                }
                
                .textoP {
                  font-size: 35px;
                  color: #181818;
                  margin: 0;
                }

                .ano {
                  font-size: 90px;
                  font-weight: bold;
                  margin: 0;
                }

                .logoAnim {
                  width: 150px;
                  margin-bottom: 15px;
                  border-radius: 50%;
                }

                @keyframes fadeIn {
                  from { transform: scale(0.9); opacity: 0;}
                  to { transform: scale(1); opacity: 1;}
                }

                /* Mostrar pop-up */
                .popup-overlay.active {
                  visibility: visible;
                  opacity: 1;
                }
              </template>
              <template id="popUpTplJs">
                // Exibir o pop-up automaticamente quando o site carregar
                window.addEventListener("load", () => {
                  const popup = document.getElementById("popup");
                  popup.classList.add("active");
                });
                
                // Botão para fechar o pop-up
                document.getElementById("closePopup").addEventListener("click", () => {
                  document.getElementById("popup").classList.remove("active");
                });
              </template>

            <div class="imgAsst">
              <div class="imgPreview">
                <img src="../src/assetsImgs/animação.png" alt="" />

              <div class="copyBtns">
                <button class="copyBtn" data-target="animacaoTplHtml">Copiar HTML</button>
                <button class="copyBtn" data-target="animacaoTplCss" data-type="css">Copiar CSS</button>
                <button class="copyBtn" data-target="animacaoTplJs" data-type="js">Copiar JS</button>
              </div>

              <template id="animacaoTplHtml">
                class="hidden"
              </template>
              <template id="animacaoTplCss">
                .hidden {
                  opacity: 0;
                  transition: 1s all;
                  transform: translateY(10%);
                }
                .show {
                  opacity: 1;
                  transition: 1s all;
                  transform: translateY(0%);
                }
                
                .conteiner {
                  transition-delay: 300ms;
                }
              </template>
              <template id="animacaoTplJs">
                const elements = document.querySelectorAll('.hidden');

                const observer = new IntersectionObserver((entries) => {
                  entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                      entry.target.classList.add('show');
                    } else {
                      entry.target.classList.remove('show');
                    }
                  });
                });

                elements.forEach((element) => {
                  observer.observe(element);
                });
              </template>
            </div>
          </section>

        <!-- Toast -->
        <div id="toast" class="toast">Texto copiado!</div>

    <script>
      $(document).ready(function () {
        $(".menu-button").on("click", function () {
          $(".menu-button").removeClass("active");

          $(this).addClass("active");

          $(".code-content").removeClass("active");

          var targetContent = $(this).data("target");

          $(targetContent).addClass("active");
        });
      });

      // Espera o DOM carregar
      document.addEventListener("DOMContentLoaded", () => {
        const hamburgerBtn = document.querySelector(".hamburger-menu");
        const sidebar = document.querySelector(".sidebar");

        if (hamburgerBtn && sidebar) {
          // Adiciona um evento de clique ao botão
          hamburgerBtn.addEventListener("click", () => {
            // Alterna a classe 'open' na barra lateral
            sidebar.classList.toggle("open");
          });
        }
      });

      /* copiar */
      const botoes = document.querySelectorAll(".copyBtn");
      const toast = document.getElementById("toast");

      function mostrarToast(mensagem) {
        toast.textContent = mensagem;
        toast.classList.add("show");

        // Esconde após 2,5s
        setTimeout(() => toast.classList.remove("show"), 2500);
      }

      botoes.forEach((botao) => {
        botao.addEventListener("click", () => {
          const texto = botao.dataset.text;
          navigator.clipboard
            .writeText(texto)
            .then(() => mostrarToast("Código copiado!"))
            .catch((err) => console.error("Erro ao copiar:", err));
        });
      });

      /* copiar */
      document.querySelectorAll(".copyBtn").forEach((btn) => {
         btn.addEventListener("click", () => {
          const tpl = document.getElementById(btn.dataset.target);
          const text = tpl.innerHTML.trim();

          navigator.clipboard.writeText(text).then(() => {
            setTimeout(() => (btn.textContent = "Copiar HTML"), 1500);

            if (btn.dataset.target.includes("Css")) {
              setTimeout(() => (btn.textContent = "Copiar CSS"), 1500);
            }

            if (btn.dataset.target.includes("Js")) {
              setTimeout(() => (btn.textContent = "Copiar JS"), 1500);
            }
          });
        });
      });
    </script>
