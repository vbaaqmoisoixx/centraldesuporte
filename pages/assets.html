              <template id="popUpTplCss">
                /* Fundo escurecido */
                .popup-overlay {
                  position: fixed;
                  top: 0;
                  left: 0;
                  width: 100%;
                  height: 100%;
                  background: rgba(0, 0, 0, 0.6);
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  visibility: hidden;
                  opacity: 0;
                  transition: opacity 0.3s ease, visibility 0.3s;
                  z-index: 9999;
                }
                
                /* Caixa do pop-up */
                .popup {
                  background: #fff;
                  padding: 30px;
                  border-radius: 15px;
                  width: 350px;
                  text-align: center;
                  box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
                  position: relative;
                  animation: fadeIn 0.5s ease;
                }

                /* Botão de fechar */
                .popup button {
                  background: #181818;
                  border: none;
                  color: #fff;
                  padding: 10px 20px;
                  border-radius: 8px;
                  cursor: pointer;
                  transition: background 0.2s;
                  margin-top: 15px;
                }
                
                .popup button:hover {
                  color: #181818;
                  background: #b6e128;
                }
                
                .textoP {
                  font-size: 35px;
                  color: #181818;
                  margin: 0;
                }

                .ano {
                  font-size: 90px;
                  font-weight: bold;
                  margin: 0;
                }

                .logoAnim {
                  width: 150px;
                  margin-bottom: 15px;
                  border-radius: 50%;
                }

                @keyframes fadeIn {
                  from { transform: scale(0.9); opacity: 0;}
                  to { transform: scale(1); opacity: 1;}
                }

                /* Mostrar pop-up */
                .popup-overlay.active {
                  visibility: visible;
                  opacity: 1;
                }
              </template>
              <template id="popUpTplJs">
                // Exibir o pop-up automaticamente quando o site carregar
                window.addEventListener("load", () => {
                  const popup = document.getElementById("popup");
                  popup.classList.add("active");
                });
                
                // Botão para fechar o pop-up
                document.getElementById("closePopup").addEventListener("click", () => {
                  document.getElementById("popup").classList.remove("active");
                });
              </template>

              <template id="animacaoTplHtml">

              <template id="animacaoTplCss">
                .hidden {
                  opacity: 0;
                  transition: 1s all;
                  transform: translateY(10%);
                }
                .show {
                  opacity: 1;
                  transition: 1s all;
                  transform: translateY(0%);
                }
                
                .conteiner {
                  transition-delay: 300ms;
                }
              </template>
              <template id="animacaoTplJs">
                const elements = document.querySelectorAll('.hidden');

                const observer = new IntersectionObserver((entries) => {
                  entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                      entry.target.classList.add('show');
                    } else {
                      entry.target.classList.remove('show');
                    }
                  });
                });

                elements.forEach((element) => {
                  observer.observe(element);
                });
              </template>

              <template id="carrosselSwiperTplCss">
                :root {
                  --text-color: #555;
                  --card-color: #ffffff;
                  --swiper-navigation-color: #008a43;
                  --swiper-navigation-color-hover: #008a4331;
                }
                
                .swiper {
                  width: 90%;
                  height: auto; 
                }
                
                /* Para permitir vários cards lado a lado dentro de um slide */
                .swiper-slide {
                  display: flex !important;
                  flex-wrap: wrap;
                  justify-content: center;
                  gap: 20px;
                  padding: 20px; 
                  height: auto!important;
                }

                /* Card */
                .card {
                  background: var(--card-color);
                  border-radius: 10px;
                  overflow: hidden;
                  box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
                  width: 300px;
                }
                
                .card img {
                  width: 150px;
                  height: 150px;
                  object-fit: cover;
                  background-position: center;
                  margin: 20px auto 0 auto;
                  border-radius: 50%;
                  display: block;
                }
                
                .card-content {
                  display: flex;
                  flex-direction: column;
                  justify-content: space-between;
                  padding: 15px;
                  text-align: center;
                }
                
                .card-content h3 {
                  margin: 0 0 10px;
                }
                
                .card-content p {
                  font-size: 14px;
                  color: var(--text-color);
                }
                
                /* remove seta padrão */
                .swiper-btn-next::after, .swiper-btn-prev::after {
                  display: none; 
                }
                
                .controles {
                  display: flex;
                  flex-direction: row-reverse;
                  gap: 10px;
                  margin-bottom: 20px;
                  margin-right: 18px
                }
                
                .swiper-btn-next, .swiper-btn-prev {
                  background: var(--card-color);
                  border-radius: 30%;
                  width: 2.5rem!important;
                  height: 2.5rem!important;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  cursor: pointer;
                  box-shadow: rgba(50, 50, 93, 0.25) 0px 2px 5px -1px, rgba(0, 0, 0, 0.3) 0px 1px 3px -1px;
                  transition: .2s ease;
                }
                
                .swiper-btn-next:hover, .swiper-btn-prev:hover {
                  background: var(--swiper-navigation-color);
                }
                
                .swiper-btn-next svg, .swiper-btn-prev svg {
                  width: 20px;
                  height: 20px;
                  fill: var(--swiper-navigation-color);
                  transition: .2s ease;
                }
                
                .swiper-btn-next:hover svg,.swiper-btn-prev:hover svg {
                  fill: var(--card-color);
                }
                
                .btnVer {
                  display: inline-block!important;
                  text-align: center!important;
                  background-color: var(--swiper-navigation-color)!important;
                  color: var(--card-color);
                  border: none;
                  border-radius: 5px;
                  padding: 10px 20px;
                  text-decoration: none;
                  transition: background-color 0.3s;
                }
                
                .btnVer:hover {
                  background-color: #8accff;
                }
              </template>
              <template id="carrosselSwiperTplJs">
                $("head").prepend(`
                <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous"/>

                <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=open_in_new"/>
                `);

                $("body").prepend(`
                <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
                `);
                var swiper = new Swiper(".swiperCarrossel", {
                  slidesPerView: 5,
                  spaceBetween: 20,
                  navigation: {
                    nextEl: ".swiper-btn-next",
                    prevEl: ".swiper-btn-prev",
                  },
                  pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                  },
                  breakpoints: {
                    // quando a tela for >= 320px
                    320: {
                      slidesPerView: 1,
                      spaceBetween: 10,
                    },
                    // quando a tela for >= 640px
                    640: {
                      slidesPerView: 2,
                      spaceBetween: 15,
                    },
                    // quando a tela for >= 768px
                    768: {
                      slidesPerView: 3,
                      spaceBetween: 20,
                    },
                    // quando a tela for >= 1024px
                    1024: {
                      slidesPerView: 4,
                      spaceBetween: 20,
                    },
                    // quando a tela for >= 1280px
                    1280: {
                      slidesPerView: 5,
                      spaceBetween: 20,
                    },
                  },
                });
              </template>

              <template id="modalTplCss">

                /* Fundo escuro */
                .modal {
                  display: none; 
                  position: fixed;
                  z-index: 9999;
                  left: 0;
                  top: 0;
                  width: 100%;
                  height: 100%;
                  background: rgba(0,0,0,0.6);

                /* Caixa do modal */

                  padding: 20px;
                  margin: 10% auto;
                  width: 90%;
                  max-width: 400px;
                  border-radius: 8px;
                  animation: fadeIn .3s;

              <template id="modalTplJs">
                $(document).ready(function () {
                  $(".openModal").click(function () {
                    let card = $(this).closest(".card");

                    let titulo = card.find("h3").text();   // pega o h3
                    let descricao = card.find("p").text(); // pega o p

              <template id="carrosselVideosTplJs">
                $(document).ready(function () {
                  let currentIndex = 0;
                  const cardWidth = $(".card").outerWidth(true);
                  const totalCards = $(".card").length;
                  const visibleCards = Math.floor(
                    $(".carousel-viewport").width() / cardWidth
                  );
                  const maxIndex = totalCards - visibleCards;
                  
                  $(".next").click(function () {
                    if (currentIndex < maxIndex) {
                      currentIndex++;
                      $(".carousel-track").css(
                        "transform",
                        `translateX(-${currentIndex * cardWidth}px)`
                        );
                      }
                      
                      if (currentIndex == maxIndex) {
                        currentIndex = 0;
                        $(".carousel-track").css(
                          "transform",
                          `translateX(-${currentIndex * cardWidth}px)`
                          );
                        }
                      });
                      
                      $(".prev").click(function () {
                        if (currentIndex > 0) {
                          currentIndex--;
                          $(".carousel-track").css(
                            "transform",
                            `translateX(-${currentIndex * cardWidth}px)`
                            );
                          }
                        });
                      });

              <template id="imgTelaCheiaTplJs">
                function abrirEmTelaCheia(element) {
                  if (!document.fullscreenElement &&
                  !document.webkitFullscreenElement &&
                  !document.msFullscreenElement) {
 
                    // Nenhum elemento está em fullscreen: entra
                    if (element.requestFullscreen) {
                      element.requestFullscreen();
                    } else if (element.webkitRequestFullscreen) {
                      element.webkitRequestFullscreen();
                    } else if (element.msRequestFullscreen) {
                      element.msRequestFullscreen();
                    }
                  } else {

                    // Já está em fullscreen: sai
                    if (document.exitFullscreen) {
                      document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                      document.webkitExitFullscreen();
                    } else if (document.msExitFullscreen) {
                      document.msExitFullscreen();
                    }
                  }
                }
                
                // Ao clicar, abre em tela cheia
                $(".fotos_noticia_img_t").click(function () {
                  abrirEmTelaCheia(this);
                });
              </template>

              <template id="contadorRegressivoTplJs">
                $(function () {
                  // Data do evento (ANO, MÊS -1, DIA, HORA, MINUTO, SEGUNDO)
                  const eventDate = new Date(
                    2026, // Ano
                    0,    // Mês
                    10,   // Dia
                    1,    // Hora
                    0,    // Minuto 
                    0,    // Segundo
                    ).getTime();
                    
                    function updateCountdown() {
                      const now = new Date().getTime();
                      const distance = eventDate - now;
                      
                      if (distance < 0) {
                        $("#days, #hours, #minutes, #seconds").text("00");
                        return;
                      }
                      
                      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                      const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                      
                      $("#days").text(days.toString().padStart(2, "0"));
                      $("#hours").text(hours.toString().padStart(2, "0"));
                      $("#minutes").text(minutes.toString().padStart(2, "0"));
                      $("#seconds").text(seconds.toString().padStart(2, "0"));
                    }

                    updateCountdown();
                    setInterval(updateCountdown, 1000);
                  });

    <script>
      $(document).ready(function () {
        $(".menu-button").on("click", function () {
          $(".menu-button").removeClass("active");

          $(this).addClass("active");

          $(".code-content").removeClass("active");

          var targetContent = $(this).data("target");

          $(targetContent).addClass("active");
        });
      });

      // Espera o DOM carregar
      document.addEventListener("DOMContentLoaded", () => {
        const hamburgerBtn = document.querySelector(".hamburger-menu");
        const sidebar = document.querySelector(".sidebar");

        if (hamburgerBtn && sidebar) {
          // Adiciona um evento de clique ao botão
          hamburgerBtn.addEventListener("click", () => {
            // Alterna a classe 'open' na barra lateral
            sidebar.classList.toggle("open");
          });
        }
      });

      /* copiar */
      const botoes = document.querySelectorAll(".copyBtn");
      const toast = document.getElementById("toast");

      function mostrarToast(mensagem) {
        toast.textContent = mensagem;
        toast.classList.add("show");

        // Esconde após 2,5s
        setTimeout(() => toast.classList.remove("show"), 2500);
      }

      botoes.forEach((botao) => {
        botao.addEventListener("click", () => {
          const texto = botao.dataset.text;
          navigator.clipboard
            .writeText(texto)
            .then(() => mostrarToast("Código copiado!"))
            .catch((err) => console.error("Erro ao copiar:", err));
        });
      });

      /* copiar */
      document.querySelectorAll(".copyBtn").forEach((btn) => {
         btn.addEventListener("click", () => {
          const tpl = document.getElementById(btn.dataset.target);
          const text = tpl.innerHTML.trim();

          navigator.clipboard.writeText(text).then(() => {
            setTimeout(() => (btn.textContent = "Copiar HTML"), 1500);

            if (btn.dataset.target.includes("Css")) {
              setTimeout(() => (btn.textContent = "Copiar CSS"), 1500);
            }

            if (btn.dataset.target.includes("Js")) {
              setTimeout(() => (btn.textContent = "Copiar JS"), 1500);
            }
          });
        });
      });
    </script>
